<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Photos - VisionBooth</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #101b40;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 90px;
            background-color: #f1f1f1;
        }

        .logo {
            font-size: 1.2em;
            font-weight: 700;
            color: #101b40;
            line-height: 1.2;
        }

        .logo span {
            display: block;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            font-size: 2.5em;
            font-weight: 800;
            color: #101b40;
            text-align: center;
            margin-bottom: 50px;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 900px;
        }

        .photo-card {
            aspect-ratio: 1;
            background: white;
            border: 4px solid #101b40;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(16, 27, 64, 0.15);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .decision-section {
            text-align: center;
            background: #f0f4ff;
            padding: 40px;
            border-radius: 16px;
            max-width: 700px;
        }

        .decision-title {
            font-size: 1.8em;
            font-weight: 700;
            color: #101b40;
            margin-bottom: 20px;
        }

        .decision-subtitle {
            font-size: 1.2em;
            color: #101b40;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .voice-instruction {
            font-size: 1em;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .detected-text {
            font-size: 1.1em;
            font-weight: 700;
            color: #101b40;
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .retake-btn {
            padding: 15px 50px;
            font-size: 1.1em;
            font-weight: 700;
            color: white;
            background-color: #e74c3c;
            border: 2.5px solid #e74c3c;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retake-btn:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }

        .continue-btn {
            padding: 15px 50px;
            font-size: 1.1em;
            font-weight: 700;
            color: white;
            background-color: #27ae60;
            border: 2.5px solid #27ae60;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background-color: #229954;
            transform: translateY(-2px);
        }

        .status-message {
            font-size: 1em;
            color: #777;
            margin-top: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 1.8em;
            }

            .photos-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .decision-section {
                padding: 30px 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .retake-btn, .continue-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <span>VISION</span>
            <span>BOOTH</span>
        </div>
    </nav>

    <div class="main-content">
        <h1 class="page-title">Review Your Photos</h1>

        <div class="photos-grid" id="photosGrid">
            <!-- Photo thumbnails will be populated here -->
        </div>

        <div class="decision-section">
            <div class="decision-title">Do you want to retake your photos?</div>
            <div class="decision-subtitle">Say YES to retake or NO to continue</div>
            
            <div class="voice-instruction">
                🎤 Listening for your response...
            </div>

            <div class="detected-text" id="detectedText">
                Waiting for voice input...
            </div>

            <div class="button-group">
                <button class="retake-btn" onclick="handleRetake()">Retake (Yes)</button>
                <button class="continue-btn" onclick="handleContinue()">Continue (No)</button>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let allPhotos = [];
        let listeningActive = false;

        socket.on('connect', () => {
            console.log('Connected to server');
            requestPhotos();
            startListening();
        });

        socket.on('photos_for_retake', (data) => {
            console.log('Received photos for retake');
            allPhotos = data.photos || [];
            displayPhotos();
        });

        socket.on('retake_response', (data) => {
            console.log('Server response:', data);
            if (data.action === 'retake') {
                window.location.href = '/index';
            } else if (data.action === 'continue') {
                window.location.href = '/template_selection';
            }
        });

        function displayPhotos() {
            const grid = document.getElementById('photosGrid');
            grid.innerHTML = '';
            
            allPhotos.forEach((photoData, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `<img src="${photoData}" alt="Photo ${index + 1}">`;
                grid.appendChild(card);
            });
        }

        function requestPhotos() {
            socket.emit('request_retake_photos');
        }

        function startListening() {
            if (listeningActive) return;
            listeningActive = true;
            
            socket.emit('start_listening_retake', {
                expected_commands: ['YES', 'NO']
            });
        }

        socket.on('voice_detected_retake', (data) => {
            const detected = data.detected_text || 'Not recognized';
            document.getElementById('detectedText').textContent = `You said: "${detected}"`;
            
            if (data.is_valid) {
                if (data.matched_command === 'YES') {
                    handleRetake();
                } else if (data.matched_command === 'NO') {
                    handleContinue();
                }
            } else {
                document.getElementById('statusMessage').textContent = 'Not recognized. Please try again.';
                setTimeout(() => startListening(), 2000);
            }
        });

        function handleRetake() {
            document.getElementById('statusMessage').textContent = 'Restarting photo session...';
            socket.emit('user_retake_decision', { action: 'retake' });
        }

        function handleContinue() {
            document.getElementById('statusMessage').textContent = 'Proceeding to template selection...';
            socket.emit('user_retake_decision', { action: 'continue' });
        }
    </script>
</body>
</html>
